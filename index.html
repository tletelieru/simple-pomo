<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/simple-pomo/favicon.svg" />
    <link rel="apple-touch-icon" href="/simple-pomo/apple-touch-icon.png" />
    <meta name="theme-color" content="#f6f6f8" />
    <title>Simple Pomodoro</title>
    <script>
      var saved = localStorage.getItem('color-mode')
      var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
      document.documentElement.dataset.theme = dark ? 'dark' : 'light'
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
